onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
panel_bg = "#181826"
accent = "#7DB6FF"

[terminal]
# Login shells so /usr/libexec/path_helper and Homebrew PATH setup run in
# every new pane, matching what tmux gave us.
shell_mode = "login"

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
# tmux muscle memory: prefix was ctrl+s
prefix = "ctrl+s"

# tmux: bind h split -h (pane to the right), bind v split -v (pane below)
split_vertical = ["prefix+h"]
split_horizontal = ["prefix+v", "prefix+minus"]

# tmux raw C-h/j/k/l nav -> alt chords (ctrl+alt owned by Raycast,
# raw ctrl chords would break backspace/enter/clear and nvim)
focus_pane_left = ["alt+h"]
focus_pane_down = ["alt+j"]
focus_pane_up = ["alt+k"]
focus_pane_right = ["alt+l"]

# tmux: M-h / M-l window switching -> alt+[ / alt+]
previous_tab = ["prefix+p", "alt+["]
next_tab = ["prefix+n", "alt+]"]

# Workspaces replace tmux sessions, so give them cheap sequential access too.
# alt+hjkl = panes, alt+[/] = tabs, alt+shift+j/k = spaces (stacked in sidebar).
previous_workspace = ["alt+shift+k"]
next_workspace = ["alt+shift+j"]
switch_workspace = "prefix+shift+1..9"

# prefix+k keeps the old sesh muscle memory, now via the built-in picker.
workspace_picker = ["prefix+k"]
goto = "prefix+space"

# prefix+e was the tmux nvim popup; scrollback editing shifts up a key.
edit_scrollback = "prefix+shift+e"

# Worktree flow on the selected space row: create / reopen / delete.
# new_worktree default is prefix+shift+g; listed for discoverability.
new_worktree = ["prefix+shift+g"]
open_worktree = ["prefix+shift+o"]
remove_worktree = ["prefix+shift+x"]

# tmux popups -> herdr popups (session-modal, layout untouched).
# Command bindings run through `/bin/sh -c`, which does not pick up the PATH a
# login shell builds, so each one goes through `zsh -lc`. That matters when the
# server is started by launchd rather than from an interactive shell.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "zsh -lc lazygit"
description = "run lazygit"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+e"
type = "popup"
command = "zsh -lc nvim"
description = "run neovim"
width = "90%"
height = "85%"

[ui]
agent_panel_sort = "priority"

# The tmux status line is gone; put branch and dirty state on the space rows.
# [ui.sidebar.spaces]
# rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
# Keep pane scrollback across server restarts; valuable when the mac mini
# server outlives the client that was attached to it.
pane_history = true
