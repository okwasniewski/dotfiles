# Any action may be a plain variant ("MissionControl") or a payload table.
# CustomShortcut: instant key-down/up. HoldShortcut: held while button is down.
# Modifiers: cmd|command, ctrl|control, alt|option, shift. Keys: a-z 0-9 f1-f20
# enter esc backspace tab space home end pageup pagedown left right up down
# and punctuation - = [ ] \ ; ' ` , . /
#
# Keep payload actions as [table] sections, never inline { }. OpenLogi
# rewrites inline tables on save and drags comments into the header.
[devices."serial:2538ap69vu58".bindings]
Back = "BrowserBack"
Forward = "BrowserForward"
MiddleClick = "MiddleClick"
DpiToggle = "CycleDpiPresets"

# Willow Voice dictation, hold to talk. Second Willow hotkey next to Fn.
